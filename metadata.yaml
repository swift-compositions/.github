# swift-compositions org-level metadata.
#
# Schema mirrors per-repo .github/metadata.yaml. Read by social-preview.sh.

description: "Composed building blocks for Swift."
homepage: "https://swift-institute.org"

socialPreview:
  accent:
    from: "#EFC868"   # gold gradient top
    to: "#C99932"     # gold gradient bottom
    text: "#8A6410"   # caption ink — 5.08:1 on #FBF8F6 (WCAG AA large-text needs 3:1)
  caption: "COMPOSITIONS"
readme:
  family: G

# Org-account profile fields (display name, description, email, website, X, location).
# Applied via `gh api -X PATCH /orgs/<org>`; no org-level sync workflow exists yet.
org:
  name: "Swift Compositions"
  description: "Composed Swift building blocks for production systems — Layer 4 of the Swift Institute ecosystem."
  email: "coen@coenttb.com"
  blog: "https://github.com/swift-institute"
  twitter: "coenttb"
  location: "Netherlands"

brand:
  mark: "Swift Institute four-bar pyramid: bar widths 80/160/240/320, the geometry of swift-institute/.github social-preview/glyph-pyramid.svg"
  ground: "#fbf8f6"
  accent:            # gold, on the base bar
    from: "#e1b659"
    to: "#a3822d"
  avatar:
    source: brand/avatar.svg
    upload: brand/avatar-1024.png   # the GitHub org-avatar uploader takes raster only
